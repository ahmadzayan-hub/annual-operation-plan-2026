# Netlify deploy config for Annual Operational Plan.
# Deploy the operational-plan/ folder as-is (no build step).
# Security headers, cache rules, and manifest MIME type are in ./_headers.

[build]
  publish = "."
  command = ""

[[redirects]]
  # Send / and /index.html to the current release (V0.6).
  # Update this on a new version — one line, one place.
  from = "/"
  to = "/Annual_Operational_Plan_2026_V0_6.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/Annual_Operational_Plan_2026_V0_6.html"
  status = 200
