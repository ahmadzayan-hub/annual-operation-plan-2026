# Netlify deploy config for Annual Operational Plan.
# Deploy the operational-plan/ folder as-is (no build step).
# Security headers, cache rules, and manifest MIME type are in ./_headers.

[build]
  publish = "."
  command = ""

[[redirects]]
  # Send / and /index.html to the current release.
  #
  # This is one of eight pins across three files: netlify.toml, vercel.json and
  # index.html (which is what GitHub Pages serves). They must all name the same
  # file. `scripts/check-current-release.mjs` enforces that in CI and prints
  # every line to change, so publishing a new release cannot silently leave a
  # host behind.
  from = "/"
  to = "/Annual_Operational_Plan_2026_V0_6.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/Annual_Operational_Plan_2026_V0_6.html"
  status = 200
